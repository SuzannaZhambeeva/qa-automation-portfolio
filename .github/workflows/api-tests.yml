name: API tests

on: [push]

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pytest api_project/ -v
        env:
          REQRES_API_KEY: ${{ secrets.REQRES_API_KEY }}
          